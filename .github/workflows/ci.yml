name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Sync (core + dev + e2b SDK + serve)
        run: uv sync --locked --extra e2b --extra serve

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Ty (type check)
        run: uv run ty check

      # Contract coverage: every spec/ file and case group must be checked, and every recorded
      # trace event must match its kind's schema, every kind recorded at least once (spec/README.md).
      - name: Pytest (unit)
        run: uv run pytest -q --contract-coverage --cov --cov-report= --cov-fail-under=0 tests/unit

      # The spec/ cases are regenerated from the Python reference; any difference means the
      # committed contract fell behind the code.
      - name: Spec is up to date
        run: |
          uv run python scripts/export_spec.py > /dev/null
          git diff --exit-code -- ../spec

      # The UI API contract (spec/serve/openapi.json) is a valid OpenAPI 3.1 document.
      - name: Lint the UI API contract
        run: npx --yes @redocly/cli@2.14.0 lint ../spec/serve/openapi.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The UI's types come from the contract and both servers embed its build: rebuilt from
      # source here, nothing may differ from what is committed (ui/README.md).
      - name: The UI bundle matches its source
        working-directory: ui
        run: |
          npm ci
          ./bundle.sh
          changed="$(git status --porcelain -- . ../python/src/lha/serve/ui ../go/internal/serve/ui)"
          if [ -n "$changed" ]; then echo "rebuild the UI (ui/bundle.sh) and commit:"; echo "$changed"; exit 1; fi

      # Every case in spec/serve/cases.json against this implementation's `lha serve`, with
      # Temporal unreachable (the fake-workflow run follows the dev server below).
      - name: UI API conformance (no Temporal)
        run: uv run pytest -q --cov --cov-append --cov-report= --cov-fail-under=0 tests/serve

      # The Temporal CLI, a pinned release verified by its checksum: `temporal server start-dev` is
      # a real server (the time-skipping test server lacks DescribeTaskQueue, which the
      # cross-language worker guard needs).
      - name: Install the Temporal CLI
        working-directory: ${{ runner.temp }}
        env:
          TEMPORAL_CLI_VERSION: "1.9.1"
          TEMPORAL_CLI_SHA256: 09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5
        run: |
          curl -fsSLo temporal.tar.gz \
            "https://github.com/temporalio/cli/releases/download/v${TEMPORAL_CLI_VERSION}/temporal_cli_${TEMPORAL_CLI_VERSION}_linux_amd64.tar.gz"
          echo "${TEMPORAL_CLI_SHA256}  temporal.tar.gz" | sha256sum -c -
          mkdir -p temporal-cli
          tar -xzf temporal.tar.gz -C temporal-cli temporal
          echo "${RUNNER_TEMP}/temporal-cli" >> "$GITHUB_PATH"

      - name: Start a Temporal dev server
        working-directory: ${{ runner.temp }}
        run: |
          nohup temporal server start-dev --headless --ip 127.0.0.1 --port 7233 \
            --db-filename temporal.db --log-level error > temporal.log 2>&1 &
          for _ in $(seq 1 60); do
            if temporal operator cluster health --address 127.0.0.1:7233; then exit 0; fi
            sleep 1
          done
          cat temporal.log
          exit 1

      # Durability + load tests boot a Temporal time-skipping test server (a binary that
      # temporalio downloads on first use); the worker-guard tests (tests/durability/
      # test_worker_guard.py) run against the dev server. They gate the build: the durability
      # guarantees the README claims are only claimed because this step passes.
      - name: Pytest (integration - Temporal test server + dev server)
        env:
          LHA_IT_TEMPORAL_ADDRESS: 127.0.0.1:7233
        run: uv run pytest -q --cov --cov-append --cov-report= --cov-fail-under=0 tests/durability tests/load
        timeout-minutes: 12

      # The controls and live state, against a fake mission workflow on the dev server.
      - name: UI API conformance (fake mission workflow)
        env:
          LHA_SERVE_TEMPORAL: 127.0.0.1:7233
        run: uv run pytest -q --cov --cov-append --cov-report= --cov-fail-under=0 tests/serve

      # Unit + durability + load coverage, gated by fail_under in pyproject.toml (one floor). The
      # pytest steps above pass --cov-fail-under=0: pytest-cov would otherwise apply the floor to
      # the unit share alone, before the durability tests append theirs.
      - name: Coverage (floor)
        run: uv run coverage report

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go/go.sum

      # Cross-implementation tests (cmd/lha e2e, hitl) shell out to the Python implementation.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Sync Python (core + dev + serve)
        working-directory: python
        run: uv sync --locked --extra serve

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go vet (windows)
        run: GOOS=windows go vet ./...

      # The UI API only grows within a major version: a change that breaks a client of the
      # previous commit's (or a pull request's base's) contract fails unless the major of
      # info.version changes (spec/serve/check-breaking.sh, oasdiff).
      - name: UI API has no breaking change
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then exit 0; fi
          git fetch --depth=1 origin "$BASE"
          spec/serve/check-breaking.sh "$BASE"

      # The Temporal CLI, a pinned release verified by its checksum: `temporal server start-dev` is
      # a real server (the time-skipping test server lacks DescribeTaskQueue, which the
      # cross-language worker guard needs).
      - name: Install the Temporal CLI
        working-directory: ${{ runner.temp }}
        env:
          TEMPORAL_CLI_VERSION: "1.9.1"
          TEMPORAL_CLI_SHA256: 09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5
        run: |
          curl -fsSLo temporal.tar.gz \
            "https://github.com/temporalio/cli/releases/download/v${TEMPORAL_CLI_VERSION}/temporal_cli_${TEMPORAL_CLI_VERSION}_linux_amd64.tar.gz"
          echo "${TEMPORAL_CLI_SHA256}  temporal.tar.gz" | sha256sum -c -
          mkdir -p temporal-cli
          tar -xzf temporal.tar.gz -C temporal-cli temporal
          echo "${RUNNER_TEMP}/temporal-cli" >> "$GITHUB_PATH"

      - name: Start a Temporal dev server
        working-directory: ${{ runner.temp }}
        run: |
          nohup temporal server start-dev --headless --ip 127.0.0.1 --port 7233 \
            --db-filename temporal.db --log-level error > temporal.log 2>&1 &
          for _ in $(seq 1 60); do
            if temporal operator cluster health --address 127.0.0.1:7233; then exit 0; fi
            sleep 1
          done
          cat temporal.log
          exit 1

      # -race runs every test (and the race detector) in one pass. The cross-language durable
      # e2e tests (a Go mission driven by the Python CLI and back), the worker guard (each
      # implementation refuses, and stops on, a task queue the other polls) and the recorded
      # histories run against the dev server started above.
      # Every trace event the suite records is also appended under LHA_TRACE_AUDIT_DIR, then
      # checked against spec/obs/mission_events.json (and every kind must have been recorded).
      - name: go test -race
        env:
          LHA_IT_TEMPORAL_ADDRESS: 127.0.0.1:7233
          LHA_TRACE_AUDIT_DIR: ${{ runner.temp }}/trace-audit
        run: |
          mkdir -p "$LHA_TRACE_AUDIT_DIR"
          go test -race ./...
        timeout-minutes: 15

      - name: Recorded events match their schemas
        env:
          LHA_TRACE_AUDIT_CHECK: ${{ runner.temp }}/trace-audit
        run: go test -count=1 -run TestTraceAudit ./internal/spec

      # Every case in spec/serve/cases.json against the Go `lha serve` (the same black-box runner
      # the Python server passes), with Temporal unreachable, then with the fake mission workflow.
      - name: UI API conformance (Go server)
        run: |
          go build -o "$RUNNER_TEMP/lha-go" ./cmd/lha
          cd ../python
          LHA_SERVE_CMD="$RUNNER_TEMP/lha-go serve" uv run pytest -q tests/serve
          LHA_SERVE_CMD="$RUNNER_TEMP/lha-go serve" LHA_SERVE_TEMPORAL=127.0.0.1:7233 \
            uv run pytest -q tests/serve

  python-services-integration:
    # Real Postgres + pgvector (migrations, cost ledger, semantic memory) and the real Docker
    # sandbox (exit codes, timeouts, OOM, read-only harness dirs, no network).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lha
          POSTGRES_PASSWORD: lha
          POSTGRES_DB: lha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lha" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Sync (core + dev + postgres + sandbox)
        run: uv sync --locked --extra postgres --extra sandbox

      # The large-mission end-to-end test runs the lead in the polyglot sandbox image and a
      # trusted e2e check (go run) on the runner itself.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Build the reference sandbox image
        working-directory: sandbox
        run: docker build -t lha-sandbox:dev .

      - name: Pytest (integration - real Postgres + Docker)
        env:
          LHA_IT_POSTGRES_DSN: postgresql://lha:lha@127.0.0.1:5432/lha
          LHA_IT_DOCKER: "1"
        run: uv run pytest -q tests/integration
        timeout-minutes: 20
