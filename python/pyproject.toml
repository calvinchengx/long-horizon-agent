[project]
name = "long-horizon-agent"
version = "0.1.0"
description = "Long-Horizon Agent: a durable, self-improving agent organization for long-horizon software missions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Calvin Cheng", email = "calvin@calvinx.com" }]
keywords = ["agents", "llm", "temporal", "durable-execution", "long-horizon", "autonomous"]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "structlog>=24.1",
    "orjson>=3.10",
    "tenacity>=8.3",
    "httpx>=0.27",
    "temporalio>=1.27.2",
]

# Heavy / environment-specific deps are opt-in extras so the core installs fast and runs at $0.
[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2", "pgvector>=0.3"]
embeddings = ["sentence-transformers>=3.0"]
observability = ["langfuse>=2.0", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp>=1.25"]
sandbox = ["docker>=7.1"]
claude = ["claude-agent-sdk>=0.1"]

[project.scripts]
lha = "lha.cli.main:app"

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ty>=0.0.83",
    "pytest-cov>=5,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lha"]

# Coverage flags are NOT in pytest addopts: CI passes them explicitly (see ci.yml), so a plain
# `pytest` run (or one in an environment without pytest-cov) never fails on unknown arguments.
[tool.coverage.run]
source = ["src/lha"]
branch = true
omit = [
    # Needs the `e2b` SDK and an E2B account; nothing in the default install can exercise it.
    "src/lha/execution/sandbox_e2b.py",
    # Thin adapter over the optional `langfuse` extra (no server in CI).
    "src/lha/obs/langfuse_exporter.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Without a precision, coverage compares the ROUNDED total against the floor (89.95% "passes" 90).
precision = 2
# ONE floor, here (not as --cov-fail-under in CI). It gates the main CI job: unit + durability +
# load tests. Keep it just under the measured total and raise it as coverage grows.
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# E501 (line length) is enforced by the formatter; it only fires here on unbreakable
# string/comment lines, so we let the formatter own width. UP042 is ignored because these
# enums intentionally subclass (str, Enum).
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
# typer requires typer.Option(...) as the default value of CLI parameters (B008).
"src/lha/cli/main.py" = ["B008"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src"]

# Optional/paid backends are imported only when their extra is installed; don't fail the type
# check when they're absent.
[tool.ty.analysis]
allowed-unresolved-imports = [
    "psycopg.**",
    "psycopg_pool.**",
    "pgvector.**",
    "e2b.**",
    "e2b_code_interpreter.**",
    "docker.**",
    "voyageai.**",
    "cohere.**",
    "sentence_transformers.**",
    "dspy.**",
    "langfuse.**",
    "opentelemetry.**",
    "claude_agent_sdk.**",
]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs real services (LHA_IT_POSTGRES_DSN / LHA_IT_DOCKER=1); skipped otherwise",
]
