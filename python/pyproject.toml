[project]
name = "long-horizon-agent"
version = "0.1.0"
description = "Long-Horizon Agent: a durable, self-improving agent organization for long-horizon software missions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Calvin Cheng", email = "calvin@calvinx.com" }]
keywords = ["agents", "llm", "temporal", "durable-execution", "long-horizon", "autonomous"]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "structlog>=24.1",
    "orjson>=3.10",
    "tenacity>=8.3",
    "httpx>=0.27",
    # Imported directly: the web tools' pinned-address network backend (DNS-rebinding defence).
    "httpcore>=1.0",
    "temporalio>=1.27.2",
]

# Heavy / environment-specific deps are opt-in extras so the core installs fast and runs at $0.
[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2", "pgvector>=0.3"]
embeddings = ["sentence-transformers>=5.6.0"]
# OTLP/HTTP trace export (to any OTLP collector, and to Langfuse through its OTLP endpoint).
observability = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
sandbox = ["docker>=7.1"]
# The e2b sandbox (LHA_SANDBOX=e2b): remote Firecracker microVMs; also needs an E2B API key.
e2b = ["e2b-code-interpreter>=1.0"]
serve = [
    "starlette>=0.46",
    "uvicorn>=0.34",
]

[project.scripts]
lha = "lha.cli.main:main"

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ty>=0.0.83",
    "pytest-cov>=5,<8",
    # The tracing tests exercise the real OpenTelemetry SDK (the `observability` extra).
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "jsonschema>=4.26.0",
]
mutation = [
    "mutmut>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lha"]

# Coverage flags are NOT in pytest addopts: CI passes them explicitly (see ci.yml), so a plain
# `pytest` run (or one in an environment without pytest-cov) never fails on unknown arguments.
[tool.coverage.run]
source = ["src/lha"]
branch = true
# Measure Python subprocesses too: the UI API runner (tests/serve) drives a real `lha serve`.
patch = ["subprocess"]
# ... and save their data when they are stopped with SIGTERM (uvicorn re-raises it on exit).
sigterm = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Without a precision, coverage compares the ROUNDED total against the floor (89.95% "passes" 90).
precision = 2
# ONE floor, here (not as --cov-fail-under in CI). It gates the main CI job: unit + durability +
# load tests. Keep it just under the measured total and raise it as coverage grows.
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# E501 (line length) is enforced by the formatter; it only fires here on unbreakable
# string/comment lines, so we let the formatter own width. UP042 is ignored because these
# enums intentionally subclass (str, Enum).
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
# typer requires typer.Option(...) as the default value of CLI parameters (B008).
"src/lha/cli/main.py" = ["B008"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src"]

# Optional/paid backends are imported only when their extra is installed; don't fail the type
# check when they're absent.
[tool.ty.analysis]
allowed-unresolved-imports = [
    "psycopg.**",
    "psycopg_pool.**",
    "pgvector.**",
    "e2b.**",
    "e2b_code_interpreter.**",
    "docker.**",
    "voyageai.**",
    "cohere.**",
    "sentence_transformers.**",
    "dspy.**",
    "opentelemetry.**",
]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs real services (LHA_IT_POSTGRES_DSN / LHA_IT_DOCKER=1); skipped otherwise",
]

# Mutation audit of the safety code (scripts/mutation_audit.sh, the nightly `mutation` workflow):
# every surviving mutant is a rule no test pins. Not part of the per-push checks (slow).
[tool.mutmut]
paths_to_mutate = [
    "src/lha/safety/commands.py",
    "src/lha/safety/egress.py",
    "src/lha/safety/rule_of_two.py",
    "src/lha/obs/redact.py",
    "src/lha/execution/paths.py",
    "src/lha/execution/egress_hosts.py",
]
# Only the tests of the mutated modules (they run once per mutant).
tests_dir = [
    "tests/unit/test_safety.py",
    "tests/unit/test_safety_bypasses.py",
    "tests/unit/test_safety_command_paths.py",
    "tests/unit/test_safety_commands.py",
    "tests/unit/test_safety_egress.py",
    "tests/unit/test_review_fixes_safety.py",
    "tests/unit/test_review_fixes_paths.py",
    "tests/unit/test_exec_paths.py",
    "tests/unit/test_obs_redact.py",
    "tests/unit/test_sandbox_egress.py",
    "tests/unit/test_spec_conformance.py",
]
also_copy = [
    "src",  # the rest of the lha package; the mutated files overwrite their copies
    "tests",  # conftest.py and helpers (only tests_dir runs)
]
